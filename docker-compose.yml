# Full stack: DebridSubsonic + slskd (Soulseek).
# Prowlarr/Lidarr templates are included commented out — you already host
# those, so only uncomment if you want them in this stack too.
#
# Usage:
#   1. cp .env.example .env   (then fill in ALLDEBRID_API_KEY etc.)
#   2. docker compose up --build -d
#   3. Open slskd at http://<host>:5030, enter your Soulseek login
#      (Settings) so the Soulseek tier can search/download.
#   4. Point Feishin/Symfonium at http://<host>:4533.

services:
  debridsubsonic:
    build: .
    image: debridsubsonic:latest
    container_name: debridsubsonic
    restart: unless-stopped
    depends_on:
      - slskd
    ports:
      - "${PORT:-4533}:4533"
    environment:
      ALLDEBRID_API_KEY: "${ALLDEBRID_API_KEY:?set your AllDebrid API key in .env}"
      SUBSONIC_USER: ${SUBSONIC_USER:-admin}
      SUBSONIC_PASS: ${SUBSONIC_PASS:-admin}
      CACHE_SIZE_GB: ${CACHE_SIZE_GB:-10}
      CACHE_DIR: /data/cache
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      MIN_SEEDERS: ${MIN_SEEDERS:-0}
      MUSIC_DIR: ${MUSIC_DIR:-}
      # Soulseek: slskd's address (service name) and downloads. The downloads
      # volume is mounted at slskd's own container default (/app/downloads),
      # so leave SLSKD_DOWNLOAD_DIR empty unless slskd uses a custom dir
      # (or runs outside this stack — then mount its folder and set the var).
      SLSKD_URL: ${SLSKD_URL:-http://slskd:5030}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SLSKD_DOWNLOAD_DIR: ${SLSKD_DOWNLOAD_DIR:-}
      PORT: "4533"
    volumes:
      - cache:/data/cache
      - slskd-downloads:/app/downloads:ro
      # Optional Tier 0: Lidarr's output, played instantly from disk.
      # Uncomment and set MUSIC_DIR=/music in .env:
      # - /path/to/music:/music:ro
    # Uncomment for FUSE/audio device passthrough if ever needed:
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - audio

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    ports:
      - "5030:5030"
    environment:
      # Primary API key (Administrator role), 16-255 chars. Env-based so it
      # survives recreates — unlike hand-edits to slskd.yml. Must match
      # SLSKD_API_KEY in .env (used by DebridSubsonic). Generate one and
      # uncomment (SLSKD_REMOTE_CONFIGURATION is NOT needed for API use):
      # - SLSKD_API_KEY=change-me-to-32-random-characters
      # Soulseek login, first run only (afterwards it lives in slskd.yml —
      # don't set different values in both places, the file wins):
      # - SLSKD_SLSK_USERNAME=your-soulseek-user
      # - SLSKD_SLSK_PASSWORD=your-soulseek-pass
    volumes:
      # App dir holds slskd.yml + working data — this mount is what makes
      # config (API key, logins) survive container recreates. slskd reads
      # /app/slskd.yml, NOT /app/config, so don't point the volume there.
      - slskd-config:/app
      - slskd-downloads:/app/downloads
    # For best Soulseek speeds, also forward your Soulseek listening port
    # (see the port in slskd Settings, default 50300) on your router to this host.

  # Optional: run Prowlarr in this stack (skip if you already host it —
  # just set PROWLARR_URL/PROWLARR_API_KEY in .env to your instance).
  # prowlarr:
  #   image: lscr.io/linuxserver/prowlarr:latest
  #   container_name: prowlarr
  #   restart: unless-stopped
  #   ports:
  #     - "9696:9696"
  #   environment:
  #     PUID: "1000"
  #     PGID: "1000"
  #   volumes:
  #     - prowlarr-config:/config

  # Optional: run Lidarr in this stack (skip if you already host it).
  # lidarr:
  #   image: lscr.io/linuxserver/lidarr:latest
  #   container_name: lidarr
  #   restart: unless-stopped
  #   ports:
  #     - "8686:8686"
  #   environment:
  #     PUID: "1000"
  #     PGID: "1000"
  #   volumes:
  #     - lidarr-config:/config
  #     - /path/to/music:/music
  #     - /path/to/downloads:/downloads

volumes:
  cache:
    driver: local
  slskd-config:
    driver: local
  slskd-downloads:
    driver: local
  # prowlarr-config:
  #   driver: local
  # lidarr-config:
  #   driver: local
