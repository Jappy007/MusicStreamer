# Full stack: MusicStreamer + slskd (Soulseek).
#
# Playback: full disk cache (instant) -> YouTube preview + background fetch
# (Soulseek lossless first, then YouTube best audio). No external indexers or
# AllDebrid account are involved.
#
# Usage:
#   1. cp .env.example .env
#   2. docker compose up --build -d
#   3. Open slskd at http://<host>:5030, enter your Soulseek login
#      (Settings) so tracks can be searched/downloaded.
#   4. Point Feishin/Symfonium at http://<host>:4533.

services:
  musicstreamer:
    build: .
    image: musicstreamer:latest
    container_name: musicstreamer
    restart: unless-stopped
    depends_on:
      - slskd
    ports:
      - "${PORT:-4533}:4533"
    environment:
      SUBSONIC_USER: ${SUBSONIC_USER:-admin}
      SUBSONIC_PASS: ${SUBSONIC_PASS:-admin}
      CACHE_SIZE_GB: ${CACHE_SIZE_GB:-10}
      CACHE_DIR: /data/cache
      # Instant playback: a low-bitrate YouTube preview streams immediately
      # while the lossless file is fetched in the background. On by default;
      # requires yt-dlp (bundled in the image).
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-true}
      PREVIEW_SIZE_GB: ${PREVIEW_SIZE_GB:-2}
      YTDLP_PATH: ${YTDLP_PATH:-yt-dlp}
      # Optional cookies file (YouTube bot-check escape hatch); mount it and
      # set YTDLP_COOKIES=/data/cookies.txt.
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      # Soulseek: slskd's address (service name) and downloads. The downloads
      # volume is mounted at slskd's own container default (/app/downloads),
      # so leave SLSKD_DOWNLOAD_DIR empty unless slskd uses a custom dir
      # (or runs outside this stack — then mount its folder and set the var).
      SLSKD_URL: ${SLSKD_URL:-http://slskd:5030}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SLSKD_DOWNLOAD_DIR: ${SLSKD_DOWNLOAD_DIR:-}
      PORT: "4533"
    volumes:
      - cache:/data/cache
      - slskd-downloads:/app/downloads:ro
      # Optional: cookies for yt-dlp, then set YTDLP_COOKIES=/data/cookies.txt
      # - ./cookies.txt:/data/cookies.txt:ro
    # Uncomment for FUSE/audio device passthrough if ever needed:
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - audio

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    ports:
      - "5030:5030"
    environment:
      # Primary API key (Administrator role), 16-255 chars. Env-based so it
      # survives recreates — unlike hand-edits to slskd.yml. Must match
      # SLSKD_API_KEY in .env (used by MusicStreamer). Generate one and
      # uncomment (SLSKD_REMOTE_CONFIGURATION is NOT needed for API use):
      # - SLSKD_API_KEY=change-me-to-32-random-characters
      # Soulseek login, first run only (afterwards it lives in slskd.yml —
      # don't set different values in both places, the file wins):
      # - SLSKD_SLSK_USERNAME=your-soulseek-user
      # - SLSKD_SLSK_PASSWORD=your-soulseek-pass
    volumes:
      # App dir holds slskd.yml + working data — this mount is what makes
      # config (API key, logins) survive container recreates. slskd reads
      # /app/slskd.yml, NOT /app/config, so don't point the volume there.
      - slskd-config:/app
      - slskd-downloads:/app/downloads
    # For best Soulseek speeds, also forward your Soulseek listening port
    # (see the port in slskd Settings, default 50300) on your router to this host.

volumes:
  cache:
    driver: local
  slskd-config:
    driver: local
  slskd-downloads:
    driver: local
